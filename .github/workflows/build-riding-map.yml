name: Build Wuhan Riding Map

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'Bounding box (minlon,minlat,maxlon,maxlat)'
        required: false
        default: '114.0,30.3,114.6,30.8'
      minzoom:
        description: 'Min zoom'
        required: false
        default: '10'
      maxzoom:
        description: 'Max zoom'
        required: false
        default: '15'

env:
  BIKE_PLANETILER_REPO: https://github.com/ohrie/bike-planetiler
  BIKE_PLANETILER_REF: 696572aaed18c2695799b2aafb96115ad3c5677b

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          osmium --version

      - name: Download hubei-latest.osm.pbf
        run: |
          wget -q https://download.geofabrik.de/asia/china/hubei-latest.osm.pbf -O hubei.osm.pbf
          ls -lh hubei.osm.pbf

      - name: Extract Wuhan bbox
        env:
          BBOX: ${{ github.event.inputs.bbox }}
        run: |
          osmium extract -b "$BBOX" hubei.osm.pbf -o wuhan.osm.pbf
          osmium fileinfo wuhan.osm.pbf | head -20

      - name: Clone bike-planetiler (pinned ref)
        run: |
          git init bike-planetiler
          git -C bike-planetiler remote add origin "$BIKE_PLANETILER_REPO"
          git -C bike-planetiler fetch --depth 1 origin "$BIKE_PLANETILER_REF"
          git -C bike-planetiler checkout FETCH_HEAD

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Download Planetiler v0.6.0
        run: |
          wget -q https://github.com/onthegomap/planetiler/releases/download/v0.6.0/planetiler.jar -O planetiler.jar
          ls -lh planetiler.jar

      - name: Build base map MBTiles (OpenMapTiles default profile)
        env:
          MINZOOM: ${{ github.event.inputs.minzoom }}
          MAXZOOM: ${{ github.event.inputs.maxzoom }}
        run: |
          java -Xmx6g -jar planetiler.jar \
            --osm_path=wuhan.osm.pbf \
            --output=wuhan-base.mbtiles \
            --minzoom="$MINZOOM" \
            --maxzoom="$MAXZOOM" \
            --force

      - name: Upload base MBTiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-base-mbtiles
          path: wuhan-base.mbtiles
          compression-level: 0
          if-no-files-found: error

      - name: Build bike-planetiler examples jar
        working-directory: bike-planetiler
        run: |
          mvn -B -q -Dmaven.test.skip=true -pl planetiler-examples -am package
          ls -lh planetiler-examples/target/*-with-deps.jar

      - name: Build surface overlay MBTiles (asphalt / gravel)
        run: |
          JAR=$(ls bike-planetiler/planetiler-examples/target/*-with-deps.jar)
          java -Xmx4g -cp "$JAR" com.onthegomap.planetiler.cycling.BikeSurfaceInfra \
            --osm_path=wuhan.osm.pbf \
            --output=wuhan-surface.mbtiles

      - name: Build bike routes overlay MBTiles
        run: |
          JAR=$(ls bike-planetiler/planetiler-examples/target/*-with-deps.jar)
          java -Xmx4g -cp "$JAR" com.onthegomap.planetiler.examples.BikeRouteOverlay \
            --osm_path=wuhan.osm.pbf \
            --output=wuhan-routes.mbtiles

      - name: Upload bike overlay MBTiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-bike-overlays-mbtiles
          path: |
            wuhan-surface.mbtiles
            wuhan-routes.mbtiles
          compression-level: 0
          if-no-files-found: error

      - name: Convert to PMTiles (optional)
        if: always()
        continue-on-error: true
        run: |
          wget -q https://github.com/protomaps/go-pmtiles/releases/download/v1.21.0/go-pmtiles_1.21.0_Linux_x86_64.tar.gz -O pmtiles.tar.gz
          tar -xzf pmtiles.tar.gz pmtiles
          chmod +x pmtiles
          for f in wuhan-*.mbtiles; do ./pmtiles convert "$f" "${f%.mbtiles}.pmtiles"; done
          ls -lh wuhan-*.pmtiles

      - name: Upload PMTiles artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wuhan-pmtiles
          path: wuhan-*.pmtiles
          compression-level: 0
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
            (ls -lh wuhan-*.mbtiles wuhan-*.pmtiles 2>/dev/null || true) | awk '{print "| "$NF" | "$5" |"}'
            echo ""
            echo "Zoom: ${{ github.event.inputs.minzoom }}-${{ github.event.inputs.maxzoom }}"
            echo "BBox: ${{ github.event.inputs.bbox }}"
          } >> "$GITHUB_STEP_SUMMARY"
